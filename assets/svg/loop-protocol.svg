<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">The governed Gauntlet Loop protocol</title>
  <desc id="desc">An animated infinity circuit connects freeze, build, critique, verify, integrate, and stop controls around a protected brain.</desc>
  <defs>
    <radialGradient id="glow" cx="66%" cy="46%" r="72%">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.48" stop-color="#121638"/>
      <stop offset="1" stop-color="#070A1D"/>
    </radialGradient>
    <linearGradient id="loop" x1="176" y1="0" x2="1026" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.34" stop-color="#8B5CF6"/>
      <stop offset="0.68" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    .circuit{stroke-dasharray:18 18;animation:travel 2.4s linear infinite}
    .halo{transform-origin:600px 190px;animation:orbit 18s linear infinite}
    .node{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}
    .spark{animation:blink 2.8s ease-in-out infinite}
    @keyframes travel{to{stroke-dashoffset:-72}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.78}}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  </style>
  <rect width="1200" height="360" rx="30" fill="url(#glow)"/>
  <rect x="10" y="10" width="1180" height="340" rx="24" fill="none" stroke="#303866"/>
  <g fill="#AAB4DB">
    <circle class="spark" cx="88" cy="73" r="2"/><circle class="spark" style="animation-delay:.5s" cx="1128" cy="64" r="2.5"/>
    <circle class="spark" style="animation-delay:1.1s" cx="1080" cy="302" r="2"/><circle class="spark" style="animation-delay:1.7s" cx="128" cy="294" r="2.5"/>
  </g>
  <text x="56" y="58" fill="#8BE9F7" font-size="13" font-weight="800" letter-spacing="3">THE CONTROLLED LOOP</text>
  <text x="56" y="92" fill="#F8FAFC" font-size="25" font-weight="800">Improve the artifact without losing the mission.</text>
  <path d="M172 198 C270 91 448 91 600 198 C752 305 930 305 1028 198 C930 91 752 91 600 198 C448 305 270 305 172 198Z" fill="none" stroke="#29315E" stroke-width="17" opacity=".8"/>
  <path class="circuit" d="M172 198 C270 91 448 91 600 198 C752 305 930 305 1028 198 C930 91 752 91 600 198 C448 305 270 305 172 198Z" fill="none" stroke="url(#loop)" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)"/>
  <g class="halo" fill="none" stroke-width="2" opacity=".64">
    <ellipse cx="600" cy="198" rx="104" ry="56" stroke="#8B5CF6" stroke-dasharray="5 11"/>
    <ellipse cx="600" cy="198" rx="78" ry="86" stroke="#22D3EE" stroke-dasharray="3 13"/>
  </g>
  <g filter="url(#softGlow)">
    <path d="M565 192c-11-24 8-48 30-39 11-19 39-12 38 10 25 2 28 36 8 45 3 23-24 35-39 18-17 17-43 3-37-20-13-2-17-9-17-14s5-11 17-14z" fill="#FB7185" stroke="#FFD0D8" stroke-width="3"/>
    <path d="M583 170c-9 7-9 18 1 23m18-38c-8 10-5 20 5 26m22-14c-11 6-14 17-6 26m-43 17c8-7 17-8 26-1m8-22c-8 8-7 20 2 28" fill="none" stroke="#8F314E" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g fill="#111631" stroke-width="3">
    <g class="node" style="animation-delay:0s"><circle cx="172" cy="198" r="30" stroke="#22D3EE"/><path d="M159 202h26M164 194h16M167 186h10" stroke="#D9FBFF" stroke-linecap="round"/><text x="172" y="244" fill="#D9FBFF" font-size="12" font-weight="800" text-anchor="middle">FREEZE</text></g>
    <g class="node" style="animation-delay:.4s"><circle cx="334" cy="130" r="30" stroke="#6D8BFF"/><path d="M320 136l10-19 20 11-10 19zM328 120l17 23" fill="none" stroke="#E6EAFF" stroke-linejoin="round"/><text x="334" y="177" fill="#E6EAFF" font-size="12" font-weight="800" text-anchor="middle">BUILD</text></g>
    <g class="node" style="animation-delay:.8s"><circle cx="476" cy="254" r="30" stroke="#8B5CF6"/><path d="M460 253c9-13 23-13 32 0-9 13-23 13-32 0z" fill="none" stroke="#F0E8FF"/><circle cx="476" cy="253" r="5" fill="#F0E8FF"/><text x="476" y="304" fill="#F0E8FF" font-size="12" font-weight="800" text-anchor="middle">CRITIQUE</text></g>
    <g class="node" style="animation-delay:1.2s"><circle cx="724" cy="130" r="30" stroke="#FB7185"/><path d="M709 130l10 10 20-24" fill="none" stroke="#FFE5EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="724" y="92" fill="#FFE5EA" font-size="12" font-weight="800" text-anchor="middle">VERIFY</text></g>
    <g class="node" style="animation-delay:1.6s"><circle cx="866" cy="254" r="30" stroke="#F59E8B"/><path d="M850 245h14v14h-14zM868 245h14v14h-14zM859 263h14v14h-14z" fill="none" stroke="#FFF0EC"/><text x="866" y="304" fill="#FFF0EC" font-size="12" font-weight="800" text-anchor="middle">INTEGRATE</text></g>
    <g class="node" style="animation-delay:2s"><circle cx="1028" cy="198" r="30" stroke="#FBBF24"/><rect x="1017" y="187" width="22" height="22" rx="3" fill="#FFF2BC"/><text x="1028" y="244" fill="#FFF2BC" font-size="12" font-weight="800" text-anchor="middle">STOP</text></g>
  </g>
  <text x="600" y="334" fill="#AAB4DB" font-size="13" text-anchor="middle">Protected gates outrank prose judgment. A human can always stop the run.</text>
</svg>
