<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc" font-family='"Google Sans","Product Sans",Roboto,"Segoe UI",Arial,sans-serif'>
<title id="title">Gauntlet Loop Brain relationship map</title>
<desc id="desc">Evidence moves through linked memory and protected gates into bounded decisions.</desc>
<style>
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .head,.chip,.arrow,.metric{animation:fu .55s ease backwards}
  .flow{stroke-dasharray:5 7;animation:dash 1.6s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  @keyframes fu{from{opacity:0;transform:translateY(10px)}}
  @keyframes dash{to{stroke-dashoffset:-24}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.72}}
</style>
<rect width="1200" height="390" fill="#070A1D"/>
<rect x="10" y="10" width="1180" height="370" rx="26" fill="#111631" stroke="#303866"/>
<text class="head" x="50" y="60" font-size="12" letter-spacing="2.4" font-weight="800" fill="#8BE9F7">THE EVIDENCE CIRCUIT</text><text class="head" x="50" y="88" font-size="24" font-weight="800" fill="#F8FAFC">How Gauntlet Loop Brain turns sources into bounded decisions</text><text class="head" style="animation-delay:0.08s" x="50" y="115" font-size="13" fill="#AAB4DB">Source cited Obsidian operating brain for designing, running, evaluating, and governing</text><text class="head" style="animation-delay:0.12s" x="50" y="133" font-size="13" fill="#AAB4DB">one-prompt multi-agent improvement loops.</text><g class="chip" style="animation-delay:0.30s"><rect x="42" y="146" width="264" height="104" rx="20" fill="#151B43" stroke="#22D3EE" stroke-opacity=".55"/><rect x="42" y="146" width="7" height="104" rx="3.5" fill="#22D3EE"/><circle class="pulse" cx="77" cy="181" r="10" fill="#22D3EE"/><text x="100" y="187" font-size="19" font-weight="800" fill="#F8FAFC">Evidence</text><text x="66" y="221" font-size="13" fill="#AAB4DB">immutable inputs</text><text x="282" y="224" font-size="40" font-weight="900" fill="#22D3EE" opacity=".16" text-anchor="end">01</text></g><g class="chip" style="animation-delay:0.46s"><rect x="326" y="146" width="264" height="104" rx="20" fill="#151B43" stroke="#8B5CF6" stroke-opacity=".55"/><rect x="326" y="146" width="7" height="104" rx="3.5" fill="#8B5CF6"/><circle class="pulse" cx="361" cy="181" r="10" fill="#8B5CF6"/><text x="384" y="187" font-size="19" font-weight="800" fill="#F8FAFC">Memory</text><text x="350" y="221" font-size="13" fill="#AAB4DB">linked notes and canon</text><text x="566" y="224" font-size="40" font-weight="900" fill="#8B5CF6" opacity=".16" text-anchor="end">02</text></g><g class="chip" style="animation-delay:0.62s"><rect x="610" y="146" width="264" height="104" rx="20" fill="#151B43" stroke="#FB7185" stroke-opacity=".55"/><rect x="610" y="146" width="7" height="104" rx="3.5" fill="#FB7185"/><circle class="pulse" cx="645" cy="181" r="10" fill="#FB7185"/><text x="668" y="187" font-size="19" font-weight="800" fill="#F8FAFC">Gates</text><text x="634" y="221" font-size="13" fill="#AAB4DB">tests, sources, confidence</text><text x="850" y="224" font-size="40" font-weight="900" fill="#FB7185" opacity=".16" text-anchor="end">03</text></g><g class="chip" style="animation-delay:0.78s"><rect x="894" y="146" width="264" height="104" rx="20" fill="#151B43" stroke="#FBBF24" stroke-opacity=".55"/><rect x="894" y="146" width="7" height="104" rx="3.5" fill="#FBBF24"/><circle class="pulse" cx="929" cy="181" r="10" fill="#FBBF24"/><text x="952" y="187" font-size="19" font-weight="800" fill="#F8FAFC">Decisions</text><text x="918" y="221" font-size="13" fill="#AAB4DB">bounded, honest outputs</text><text x="1134" y="224" font-size="40" font-weight="900" fill="#FBBF24" opacity=".16" text-anchor="end">04</text></g><g class="arrow" style="animation-delay:0.50s"><line class="flow" x1="310" y1="198" x2="322" y2="198" stroke="#AAB4DB" stroke-width="3" stroke-linecap="round"/><path d="M318,192 L326,198 L318,204" fill="none" stroke="#AAB4DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="arrow" style="animation-delay:0.66s"><line class="flow" x1="594" y1="198" x2="606" y2="198" stroke="#AAB4DB" stroke-width="3" stroke-linecap="round"/><path d="M602,192 L610,198 L602,204" fill="none" stroke="#AAB4DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="arrow" style="animation-delay:0.82s"><line class="flow" x1="878" y1="198" x2="890" y2="198" stroke="#AAB4DB" stroke-width="3" stroke-linecap="round"/><path d="M886,192 L894,198 L886,204" fill="none" stroke="#AAB4DB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text class="metric" x="50" y="294" font-size="12" letter-spacing="2.2" font-weight="800" fill="#8BE9F7">LIVE VAULT SIGNALS</text><g class="metric" style="animation-delay:0.86s"><rect x="50" y="308" width="250" height="54" rx="16" fill="#12364B" stroke="#22D3EE" stroke-opacity=".45"/><circle class="pulse" cx="78" cy="335" r="7" fill="#22D3EE"/><text x="98" y="332" font-size="18" font-weight="800" fill="#C8F8FF">15</text><text x="98" y="350" font-size="12" font-weight="700" fill="#C8F8FF">source ledger entries</text></g><g class="metric" style="animation-delay:0.94s"><rect x="318" y="308" width="250" height="54" rx="16" fill="#2B214D" stroke="#8B5CF6" stroke-opacity=".45"/><circle class="pulse" cx="346" cy="335" r="7" fill="#8B5CF6"/><text x="366" y="332" font-size="18" font-weight="800" fill="#E9DCFF">13</text><text x="366" y="350" font-size="12" font-weight="700" fill="#E9DCFF">concept notes</text></g><g class="metric" style="animation-delay:1.02s"><rect x="586" y="308" width="250" height="54" rx="16" fill="#472439" stroke="#FB7185" stroke-opacity=".45"/><circle class="pulse" cx="614" cy="335" r="7" fill="#FB7185"/><text x="634" y="332" font-size="18" font-weight="800" fill="#FFE3E9">15</text><text x="634" y="350" font-size="12" font-weight="700" fill="#FFE3E9">canon entries</text></g><g class="metric" style="animation-delay:1.12s"><rect x="866" y="308" width="292" height="54" rx="16" fill="#171D46" stroke="#303866"/><path d="M892 335c13-17 33-17 46 0-13 17-33 17-46 0z" fill="none" stroke="#22D3EE" stroke-width="2"/><circle cx="915" cy="335" r="6" fill="#FB7185"/><text x="952" y="331" font-size="13" font-weight="800" fill="#F8FAFC">inspect, challenge, stop</text><text x="952" y="350" font-size="12" fill="#AAB4DB">human authority stays outside the loop</text></g>
